name: Bug report
description: Something on estimay.io doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Please leave out room codes and links if your room has anything private in it.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a room
        2. ...
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Room in a browser
        - Public site or blog
        - Google Meet
        - Telegram
        - Slack
        - Discord
        - Jira
        - Linear
        - Trello
        - Asana
        - GitHub Issues
        - AI assistant (MCP)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on macOS, Safari on iPhone, ...
